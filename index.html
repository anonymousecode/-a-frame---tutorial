<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="color-toggle.js"></script>
    <script src="target-marker.js"></script>
    <title>3D Scene with A-Frame</title>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
      <a-box position="-1 1 -3" rotation="0 45 0" color="#4CC3D9" color-toggle animation="property: rotation; to: 0 360 0; easing: linear; dur:5000; loop:true;"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" color-toggle animation="property: position; to: 0 2 -5; dur: 2000; easing: easeInOutQuad"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" color-toggle animation="property: scale; to: 2 2 2; dur: 1000; direction: alternate; loop: true"></a-cylinder>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4" ></a-plane>
      <a-sky src="/panoramic-view-sea_1048-1494.avif"></a-sky>

        <a-entity id="rig">
            <a-entity camera position="0 2 0" look-controls wasd-controls>
                <a-cursor id="cursor" raycaster fuse="true" fuse-timeout="3000" color="#EF2D5E"></a-cursor>
            </a-entity>
        </a-entity>
    </a-scene>
  </body>
</html>
